<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>موعد إصدار الشهادات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef3f4;
    --card: #ffffff;
    --ink: #12303a;
    --muted: #5c7480;
    --line: #cfdce1;
    --brand: #0f6b78;
    --brand-dark: #0a4f5a;
    --soft: #e3f1f3;
    --error: #b3261e;
    --ok: #1b7a4b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "IBM Plex Sans Arabic", Tahoma, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    min-height: 100vh;
    line-height: 1.7;
  }
  .card {
    background: var(--card);
    width: 100%;
    max-width: 460px;
    border-radius: 16px;
    border: 1px solid var(--line);
    padding: 32px 28px;
    box-shadow: 0 10px 30px rgba(15, 107, 120, .08);
  }
  h1 { font-size: 1.5rem; margin: 0 0 6px; }
  p.lead { margin: 0 0 24px; color: var(--muted); }
  .step { display: none; }
  .step.active { display: block; }

  label.field { display: block; font-weight: 500; margin-bottom: 8px; }
  input[type="text"] {
    width: 100%;
    font: inherit;
    font-size: 1.15rem;
    letter-spacing: .12em;
    padding: 14px 16px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    background: #fff;
    color: var(--ink);
    direction: ltr;
    text-align: right;
  }
  input[type="text"]:focus { outline: 3px solid var(--soft); border-color: var(--brand); }

  .options { display: grid; gap: 12px; margin-bottom: 8px; }
  .option { position: relative; }
  .option input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
  .option .box {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 18px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    font-size: 1.1rem; font-weight: 500;
    transition: border-color .15s, background .15s;
  }
  .option .box small { color: var(--muted); font-weight: 400; font-size: .85rem; }
  .option input:checked + .box { border-color: var(--brand); background: var(--soft); }
  .option input:focus-visible + .box { outline: 3px solid var(--brand); outline-offset: 2px; }

  .error { color: var(--error); min-height: 1.6em; margin: 8px 0 0; font-size: .95rem; }

  .actions { display: flex; gap: 10px; margin-top: 18px; }
  button {
    font: inherit; font-weight: 700; cursor: pointer;
    border-radius: 10px; padding: 13px 18px; border: 0;
  }
  button.primary { background: var(--brand); color: #fff; flex: 1; }
  button.primary:hover { background: var(--brand-dark); }
  button.primary:disabled { opacity: .6; cursor: wait; }
  button.ghost { background: transparent; color: var(--brand); border: 1.5px solid var(--line); }
  button:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }

  .done { text-align: center; }
  .done .tick {
    width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 50%;
    background: var(--ok); color: #fff; display: grid; place-items: center; font-size: 2rem;
  }
  .summary { background: var(--soft); border-radius: 10px; padding: 14px; margin-top: 16px; text-align: right; }
  .summary div { display: flex; justify-content: space-between; padding: 4px 0; }
  .summary b { direction: ltr; }
</style>
</head>
<body>

<main class="card">

  <!-- الشاشة 1: رقم الهوية -->
  <section id="step1" class="step active">
    <h1>موعد إصدار الشهادات</h1>
    <p class="lead">أدخل رقم الهوية للمتابعة إلى اختيار الموعد.</p>
    <label class="field" for="nid">رقم الهوية</label>
    <input id="nid" type="text" inputmode="numeric" autocomplete="off" maxlength="10" placeholder="0000000000">
    <p class="error" id="err1" role="alert"></p>
    <div class="actions">
      <button class="primary" id="next">متابعة</button>
    </div>
  </section>

  <!-- الشاشة 2: اختيار التاريخ -->
  <section id="step2" class="step">
    <h1>اختر تاريخ الإصدار</h1>
    <p class="lead">اختر اليوم المناسب لاستلام شهادتك.</p>
    <div class="options" id="options"></div>
    <p class="error" id="err2" role="alert"></p>
    <div class="actions">
      <button class="primary" id="submit">تأكيد الموعد</button>
      <button class="ghost" id="back">رجوع</button>
    </div>
  </section>

  <!-- الشاشة 3: التأكيد -->
  <section id="step3" class="step done">
    <div class="tick" aria-hidden="true">✓</div>
    <h1>تم تسجيل الموعد</h1>
    <p class="lead">سيتم إصدار شهادتك في التاريخ التالي.</p>
    <div class="summary">
      <div><span>رقم الهوية</span><b id="sumId"></b></div>
      <div><span>تاريخ الإصدار</span><b id="sumDate"></b></div>
    </div>
  </section>

</main>

<script>
  // ====== الإعدادات (عدّلها حسب حاجتك) ======
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxxy2wnAfeaixBpsgxK7aCVh0iNM9HrEyn4EPS3gXQNypwkWNAs3wdwJhrlVoSpG-pR/exec";      // رابط Google Apps Script
  const ID_LENGTH  = 10;                          // عدد خانات رقم الهوية
  const DATES = [                                 // التواريخ المتاحة
    { value: "19/11/2026", label: "19/11/2026", hint: "الخميس" },
    { value: "20/11/2026", label: "20/11/2026", hint: "الجمعة" }
  ];
  // ==========================================

  const $ = id => document.getElementById(id);
  const steps = [$("step1"), $("step2"), $("step3")];
  function show(n) { steps.forEach((s, i) => s.classList.toggle("active", i === n)); }

  // بناء خيارات التاريخ
  $("options").innerHTML = DATES.map((d, i) => `
    <label class="option">
      <input type="radio" name="date" value="${d.value}" ${i === 0 ? "" : ""}>
      <span class="box"><span>${d.label}</span><small>${d.hint}</small></span>
    </label>`).join("");

  // السماح بالأرقام فقط (يدعم الأرقام العربية أيضًا)
  function normalizeDigits(str) {
    return str
      .replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d))
      .replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d))
      .replace(/\D/g, "");
  }
  $("nid").addEventListener("input", e => { e.target.value = normalizeDigits(e.target.value); });

  // الشاشة 1 -> 2
  function goNext() {
    const id = $("nid").value;
    if (id.length !== ID_LENGTH) {
      $("err1").textContent = `رقم الهوية يجب أن يتكون من ${ID_LENGTH} أرقام.`;
      return;
    }
    $("err1").textContent = "";
    show(1);
  }
  $("next").addEventListener("click", goNext);
  $("nid").addEventListener("keydown", e => { if (e.key === "Enter") goNext(); });
  $("back").addEventListener("click", () => show(0));

  // الشاشة 2 -> إرسال -> 3
  $("submit").addEventListener("click", async () => {
    const chosen = document.querySelector('input[name="date"]:checked');
    if (!chosen) { $("err2").textContent = "اختر تاريخ الإصدار أولًا."; return; }
    $("err2").textContent = "";

    const btn = $("submit");
    btn.disabled = true; btn.textContent = "جارٍ الحفظ…";

    const payload = { nationalId: $("nid").value, issueDate: chosen.value };

    try {
      const res = await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(payload)   // بدون headers لتجنب مشكلة CORS
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.message || "فشل الحفظ");

      $("sumId").textContent = payload.nationalId;
      $("sumDate").textContent = payload.issueDate;
      show(2);
    } catch (err) {
      $("err2").textContent = "تعذّر حفظ الموعد. تحقق من الاتصال وحاول مرة أخرى.";
    } finally {
      btn.disabled = false; btn.textContent = "تأكيد الموعد";
    }
  });
</script>
</body>
</html>
